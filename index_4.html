<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guillermo R. Monroy — Web developer and 3D modeling enthusiast. Showcasing creative Android and Microsoft Store Aplications, modern portfolio designs, and interactive 3D projects built with Blender." />
    <title>3D Museum Gallery</title>
    <link rel= "icon" href="favicon.ico">

    <link rel="stylesheet" type="text/css" href="style.css"> 

 <script type="module" src="mobile/model-viewer.min.js"></script>
   
<style>
    
    .model-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid transparent;
      color: #e0e0e0;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .model-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .model-btn.active {
      background: #ffffff;
      color: #121214;
      font-weight: 600;
    }
    .hotspot-card {
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
   
</head>
<body>

    <header >
     3D Museum Gallery | 3D models created by Guillermo R Monroy
    </header>
    <div class="centerback"><h1>⏳ Loading 3D Scene...</h1></div>
    
	
	
    <div class="model-container">
        <model-viewer 
            src="2snake.glb" 
            alt="Earth 3D View" 
            camera-controls 
            skybox-image="museum.jpg"
            disable-pan
            auto-rotate 
            camera-orbit="90deg 90deg auto"
			max-camera-orbit="auto 90deg auto"
            id="mainViewer"
            autoplay 
            disable-zoom
            rotation-per-second="3deg"
            shadow-intensity="0"
            interaction-prompt="auto"
            environment-image="neutral_HDR.jpg"
            exposure="1"
            disable-tap>
			
              <div class="progress-bar" slot="progress-bar">
    <div class="update-bar"></div>
  </div>   
            
        </model-viewer>
		
    </div>
	
    <footer>
	<div>
    <button class="model-btn active" onclick="loadModel('earth')">Aztec Snake</button>
    <button class="model-btn" onclick="loadModel('trex')">Toltec Atlantean</button>
  </div>
    
    </footer>
	
    <script>
    const viewer = document.querySelector('#mainViewer');
    const hotspotContainer = document.querySelector('#hotspotContainer');
    const buttons = document.querySelectorAll('.model-btn');

    // Data registry for models, lighting, and custom hotspots
    const modelData = {
      earth: {
        src: '2snake.glb',
        
        hotspots: [
          { slot: 'hotspot-1', pos:"-0.2519135091863802m -6.6936707720453m -0.020509003591680397m", normal:"-0.9999019462189667m -0.013919839628185963m -0.0015284018608544357m", text: 'Atmosphere Boundary' }
        ]
      },
      trex: {
        src: 'atlante.glb',
        
        hotspots: [
          { slot: 'hotspot-1', pos: '0.1m 1.4m 0.8m', normal: '0m 1m 0m', text: 'Cranial Fossil' },
          { slot: 'hotspot-2', pos: '-0.2m 0.9m -0.5m', normal: '0m 0m 1m', text: 'Vertebral Column' }
        ]
      },
      
    };

    function loadModel(key) {
      const data = modelData[key];
      if (!data) return;

      // Update button active state
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Update model source and environment settings
      viewer.src = data.src;
      viewer.exposure = data.exposure;
      viewer.shadowIntensity = data.shadowIntensity;

      // Reset camera to frame new model bounds
      viewer.cameraOrbit = 'auto auto auto';
      viewer.cameraTarget = 'auto auto auto';

      // Clear previous hotspots and inject new ones
      hotspotContainer.innerHTML = '';
      if (data.hotspots) {
        data.hotspots.forEach(hp => {
          const btn = document.createElement('button');
          btn.slot = hp.slot;
          btn.dataset.position = hp.pos;
          if (hp.normal) btn.dataset.normal = hp.normal;
          btn.className = 'hotspot-card';
          btn.textContent = hp.text;
          hotspotContainer.appendChild(btn);
        });
      }
    }
  </script>
    <script src="script.js"></script>

</body>
</html>
