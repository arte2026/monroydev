<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guillermo R. Monroy — Web developer and 3D modeling enthusiast. Showcasing creative Android and Microsoft Store Aplications, modern portfolio designs, and interactive 3D projects built with Blender." />
    <title>3D Museum Gallery</title>
    <link rel= "icon" href="favicon.ico">

    <link rel="stylesheet" type="text/css" href="style.css"> 

 <script type="module" src="model-viewer.min.js"></script>
   
</head>
<body>

    <header >
     3D Museum Gallery | 3D models created by Guillermo R Monroy
    </header>
    
	
    <div class="model-container">
        <model-viewer 
            src="../2snake.glb" 
            alt="Aztec Snake" 
            camera-controls 
            skybox-image="../skybox.jpg"
            disable-pan
            auto-rotate 
            camera-orbit="90deg 90deg auto"
			max-camera-orbit="auto 90deg auto"
            id="mainViewer"
            autoplay 
            disable-zoom
            rotation-per-second="3deg"
            shadow-intensity="1"
            interaction-prompt="auto"
            environment-image="neutral_HDR.jpg"
            exposure="1"
            disable-tap>
			
              <div class="progress-bar" slot="progress-bar">
    <div class="update-bar"></div>
  </div>   
          
<button slot="hotspot-1" class="hotspot-card" data-position="-0.2562244535185485m -6.023097880556989m 0.19834495610086167m" data-visibility-attribute="visible" data-normal="-0.9999019462189667m -0.013919839628185963m -0.0015284018608544357m"><div class="annotation-box">The Double-headed serpent is an Aztec sculpture. It is a snake with two heads composed of mostly turquoise pieces applied to a wooden base. It might have been worn or displayed in religious ceremonies. The mosaic is made of pieces of turquoise, spiny oyster shell and conch shell. The sculpture is at the British Museum.</div></button>
		  
        </model-viewer>
		
    </div>
	
    <footer>
	<div>
    <button class="model-btn active" onclick="loadModel('snake')">Aztec Snake</button>
    <button class="model-btn" onclick="loadModel('toltec')">Toltec Atlantean</button>
	<button class="model-btn" onclick="loadModel('lewis')">Lewis Chessmen</button>
        <button class="model-btn" onclick="loadModel('cara')">Caravanserai</button>
        <button class="model-btn" onclick="loadModel('torso2')">Torso Sculpture</button>
  </div>
    
    </footer>
	
    <script>
    const viewer = document.querySelector('#mainViewer');
    
    const buttons = document.querySelectorAll('.model-btn');

    // Data registry for models, lighting, and custom hotspots
    const modelData = {
      snake: {
        src: '../2snake.glb',
        
        hotspots: [
          { slot: 'hotspot-1', pos:'-0.2562244535185485m -6.023097880556989m 0.19834495610086167m', normal:'-0.9999019462189667m -0.013919839628185963m -0.0015284018608544357m', text: 'The Double-headed serpent is an Aztec sculpture. It is a snake with two heads composed of mostly turquoise pieces applied to a wooden base. It might have been worn or displayed in religious ceremonies. The mosaic is made of pieces of turquoise, spiny oyster shell and conch shell. The sculpture is at the British Museum.' }
        ]
      },
      toltec: {
        src: '../atlante.glb',
        
        hotspots: [
          { slot: 'hotspot-1', pos: '9.35395615715521m 17.30274669925037m -1.2658335185240217m', normal: '0.9571651115087653m 0.28895694041163034m 0.018407495711331462m', text: 'The Atlantean figures are four anthropomorphic, hand-carved stone statues, belonging to the Toltec culture from the city of Tula in Mexico.  The construction of the Toltec empire has been dated to approximately 750 CE. This date mark the earliest time that the figures could have been carved.' },
          
        ]
      },
      lewis: {
        src: '../lewis.glb',
        
        hotspots: [
          { slot: 'hotspot-1', pos: '10.901827649340461m 2.388253869988681m 16.7214724082297m', normal: '0.9957060214119362m 0.055878306193639614m 0.07380470053419948m', text: 'The Lewis Chessmen are a group of distinctive 12th-century chess pieces, along with other game pieces, most of which are carved from walrus ivory. Discovered in 1831 on the Isle of Lewis in the Outer Hebrides of Scotland, they may constitute some of the few surviving medieval chess sets.' },
          
        ]
      },
        cara: {
        src: '../caravanserai3.glb',
        
        hotspots: [
          { slot: 'hotspot-1', pos: '-0.003710571354713634m 0.08164042277481952m -0.00888818230738242m', normal: '0m -1.1920930742537195e-7m -0.9999999999999929m', text: 'Decorative Caravanserai Relief Artwork.' },
          
        ]
      },
        torso2: {
        src: '../torso2.glb',
        
        hotspots: [
          { slot: 'hotspot-1', pos: '0.07191177701767765m 0.0027496259123580055m -0.06452089408057383m', normal: '0.9681245996498783m -0.24893707544388693m -0.027660296856820022m', text: 'Torso Sculpture' },
          
        ]
      },
    };

    function loadModel(key) {
    const data = modelData[key];
    if (!data) return;

    // Update button active state
    buttons.forEach(btn => btn.classList.remove('active'));
    if (window.event && window.event.target) {
        window.event.target.classList.add('active');
    }

    // Update model source and reset camera
    viewer.src = data.src;
    viewer.cameraOrbit = 'auto auto auto';
    viewer.cameraTarget = 'auto auto auto';

    // 1. Find and remove ONLY the old hotspots
    const existingHotspots = viewer.querySelectorAll('.hotspot-card');
    existingHotspots.forEach(hp => hp.remove());

    // 2. Inject new hotspots with the nested annotation box
    if (data.hotspots) {
        data.hotspots.forEach(hp => {
            // Create the main hotspot button
            const btn = document.createElement('button');
            btn.slot = hp.slot;
            btn.className = 'hotspot-card';
            btn.setAttribute('data-position', hp.pos);
			// Add the visibility attribute here
            btn.setAttribute('data-visibility-attribute', 'visible');
            if (hp.normal) {
                btn.setAttribute('data-normal', hp.normal);
            }
            
            // Create the inner div for the annotation
            const annotationBox = document.createElement('div');
            annotationBox.className = 'annotation-box';
            annotationBox.textContent = hp.text;
            
            // Put the div inside the button
            btn.appendChild(annotationBox);
            
            // Append the fully constructed button to the viewer
            viewer.appendChild(btn); 
        });
    }
}
        viewer.addEventListener('progress', (event) => {
    const updateBar = document.querySelector('.update-bar');
    const progressBar = document.querySelector('.progress-bar');
    
    // event.detail.totalProgress is a number between 0 and 1
    const progress = event.detail.totalProgress * 100;
    updateBar.style.width = `${progress}%`;

    // model-viewer automatically adds a "hide" class when loading finishes.
    // We can also manually manage visibility if needed.
    if (progress === 100) {
        progressBar.classList.add('hide');
    } else {
        progressBar.classList.remove('hide');
    }
});
  </script>
    <script src="script.js"></script>

</body>
</html>
