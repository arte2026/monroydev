<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guillermo R. Monroy — Web developer and 3D modeling enthusiast. Showcasing creative Android and Microsoft Store Aplications, modern portfolio designs, and interactive 3D projects built with Blender." />
    <title>Earth 3D View</title>
    <link rel= "icon" href="favicon.ico">

    <link rel="stylesheet" type="text/css" href="style.css"> 
    
    <script type="module" src="model-viewer.min.js"></script>                
    
</head>
<body>

    <header >
    Earth 3D Viewer
    </header>
    <div class="centerback"><h1>⏳ Loading 3D Scene...</h1></div>
    
    <div class="model-container">
        <model-viewer 
            src="earth.glb" 
            alt="Earth 3D View" 
            camera-controls 
            skybox-image="../stars.jpg"
            disable-pan
            auto-rotate 
            camera-orbit="90deg 90deg auto"
            id="portfolio-cube"
            autoplay 
            disable-zoom
            rotation-per-second="3deg"
            shadow-intensity="0"
            interaction-prompt="auto"
            environment-image="../neutral.jpg"
            exposure="1"
            disable-tap>
              <div class="progress-bar" slot="progress-bar">
    <div class="update-bar"></div>
  </div>   
	 <div class="variant-buttons">
    <button id="variant1">Earth Day</button>
    <button id="variant2">Earth Night</button>
</div>          
            
        </model-viewer>
		
    </div>
	
    <footer>
	
    Guillermo R Monroy - 2026 - <a href="index.html" target="_self"> GO BACK</a>
    </footer>
    <script type="module">
	const viewer = document.querySelector('#portfolio-cube');

const variant1Button = document.querySelector('#variant1');
const variant2Button = document.querySelector('#variant2');

viewer.addEventListener('load', () => {
    console.log('Available variants:', viewer.availableVariants);

    // Set the initial variant
    viewer.variantName = viewer.availableVariants[0];
});

variant1Button.addEventListener('click', () => {
    viewer.variantName = viewer.availableVariants[0];
});

variant2Button.addEventListener('click', () => {
    viewer.variantName = viewer.availableVariants[1];
});
	</script>
    <script src="script.js"></script>

</body>
</html>
