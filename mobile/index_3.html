<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guillermo R. Monroy — Web developer and 3D modeling enthusiast. Showcasing creative Android and Microsoft Store Aplications, modern portfolio designs, and interactive 3D projects built with Blender." />
    <title>Earth 3D View</title>
    <link rel= "icon" href="favicon.ico">

    <link rel="stylesheet" type="text/css" href="style.css"> 
    
    <script type="module" src="model-viewer.min.js"></script>                
    
</head>
<body>

    <header >
    🌎 Earth 3D Viewer - Select Layout:<br>
    <button id="earthButton" class="variant-buttons">🌞 Day</button>
    <button id="nightButton" class="variant-buttons">🌜 Night</button>

    </header>
    
    <div class="model-container">
        <model-viewer 
            src="earth.glb" 
            alt="Earth 3D View" 
            camera-controls 
            skybox-image="../stars.jpg"
            disable-pan
            auto-rotate 
            camera-orbit="90deg 90deg auto"
            id="portfolio-cube"
            autoplay 
            disable-zoom
            rotation-per-second="3deg"
            shadow-intensity="0"
            interaction-prompt="auto"
            environment-image="../neutral.jpg"
            exposure="1"
            disable-tap>
              <div class="progress-bar" slot="progress-bar">
    <div class="update-bar"></div>
  </div>           
            
        </model-viewer>
		
    </div>
	
    <footer>
	
    Guillermo R Monroy - 2026 - <a href="index.html" target="_self"> GO BACK</a>
    </footer>
    <script type="module">
	const viewer = document.querySelector('#portfolio-cube');

const earthButton = document.querySelector('#earthButton');
const nightButton = document.querySelector('#nightButton');

earthButton.addEventListener('click', () => {
    viewer.variantName = 'Earth1';
});

nightButton.addEventListener('click', () => {
    viewer.variantName = 'Night1';
});
	</script>
    <script src="script.js"></script>

</body>
</html>
