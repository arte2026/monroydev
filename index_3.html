<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guillermo R. Monroy — Web developer and 3D modeling enthusiast. Showcasing creative Android and Microsoft Store Aplications, modern portfolio designs, and interactive 3D projects built with Blender." />
    <title>Earth 3D View</title>
    <link rel= "icon" href="favicon.ico">

    <link rel="stylesheet" type="text/css" href="style.css"> 
 
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
          "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@^0.183.0/build/three.module.min.js"
  }
      }
    </script>
    
    <script type="module" src="model-viewer-module.min.js"></script>

                  <script type="module" src="model-viewer-effects.min.js"></script>
    
</head>
<body>

    <header >
    Earth 3D View
    </header>
    <div class="centerback"><h1>⏳ Loading 3D Scene...</h1></div>
    
    <div class="model-container">
        <model-viewer 
            src="earth.glb" 
            alt="Earth 3D View" 
            camera-controls 
            skybox-image="stars.jpg"
            disable-pan
            auto-rotate 
            camera-orbit="90deg 90deg auto"
            id="portfolio-cube"
            autoplay 
            disable-zoom
            rotation-per-second="3deg"
            shadow-intensity="0"
            interaction-prompt="auto"
            environment-image="neutral_HDR.jpg"
            exposure="1"
            disable-tap>
              <div class="progress-bar" slot="progress-bar">
    <div class="update-bar"></div>
  </div>   
	 <div class="controls glass">
                    <div>Variant: <custom-select id="variant"></custom-select></div>
                  </div>
            <effect-composer>
			<outline-effect id="global-outline" color="blue" blend-mode="skip"></outline-effect>
                <ssao-effect strength="8"></ssao-effect>  
                
                <bloom-effect strength="2"></bloom-effect>
                <color-grade-effect></color-grade-effect>
            </effect-composer>
            
        </model-viewer>
		
    </div>
	
    <footer>
	
    Guillermo R Monroy - ver. 1.8 2026 - <a href="index.html" target="_self"> GO BACK</a>
    </footer>
    <script>
	const viewer = document.querySelector('#portfolio-cube');
const outline = document.querySelector('#global-outline');

viewer.addEventListener('load', () => {
    // Access the internal Three.js scene graph via the Symbol property
    const symbols = Object.getOwnPropertySymbols(viewer);
    const sceneSymbol = symbols.find(s => s.description === 'scene');
    
    if (sceneSymbol && viewer[sceneSymbol]) {
        const scene = viewer[sceneSymbol];
        // Apply the outline to all child meshes in the scene
        outline.selection = [scene];
    } else {
        // Fallback for modern standard releases
        const model = viewer.model;
        if (model) {
            outline.selection = [model];
        }
    }
});
                 
                
	</script>
    <script src="script.js"></script>

</body>
</html>
